# Build the pkgdown site and deploy it to GitHub Pages via the
# official Pages artifact + deploy-pages actions.
#
# This branch, and not main, is where the site lives. Bioconductor
# requires the package source to carry no pkgdown content, so `_pkgdown.yml`,
# `pkgdown/`, `vignettes/articles/` and this workflow were taken off main
# and off the Bioconductor devel branch and kept here.
#
# How to publish an updated site: merge main into this branch and push.
# The push is the trigger. A manual run is not available, because
# workflow_dispatch only works for workflows that live on the default
# branch, and a release event would run the default branch copy of this
# file, which no longer exists.
#
# Two repo settings this depends on: Settings -> Pages -> Source =
# "GitHub Actions", and this branch listed among the deployment branches
# of the `github-pages` environment.
on:
  push:
    branches: [docs-site]

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      # cache-version is bumped deliberately, not decoratively. The
      # restored library kept clusterProfiler and igraph from when they
      # were dependencies of this package. They are not any more, so the
      # system libraries they need are no longer installed either, and
      # the stale igraph.so failed to load against a missing libglpk.
      # pkgdown reached it while resolving a package reference in the
      # documentation, and the site build died on a dependency the
      # package had already dropped. Bump this again if the library ever
      # needs to be rebuilt from scratch.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website
          cache-version: 2

      - name: Build pkgdown site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
