name: Release on version bump

# Manual only. This used to fire on every push to main, so a version bump
# that happened to travel with other work cut a release before the work
# around it was ready: 0.99.9 was tagged while its citation file still
# named 0.99.2. Cutting a release is a decision, and decisions are taken
# by someone rather than triggered by a diff.
#
# Run it from the Actions tab, or:
#   gh workflow run release.yaml --ref main
# It still refuses to act when the tag for the current DESCRIPTION
# version already exists, so running it twice is harmless.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from DESCRIPTION
        id: ver
        run: |
          v=$(grep '^Version:' DESCRIPTION | sed 's/Version:[[:space:]]*//')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"     >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract NEWS section for this version
        if: steps.check.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v marker="# Changes in version $v" '
            $0 == marker { in_section = 1; next }
            /^# Changes in version / && in_section { exit }
            in_section { print }
          ' NEWS.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${{ steps.ver.outputs.tag }}" > release_notes.md
          fi

      - name: Create tag and GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file release_notes.md \
            --target main
