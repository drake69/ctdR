          "identifier": "https://orcid.org/0000-0003-1218-230X",
          "url": "https://orcid.org/0000-0003-1218-230X"
        },
        "identifier": "https://doi.org/10.5281/zenodo.19344200",
        "sameAs": [
          "https://github.com/drake69/ctdR",
          "https://doi.org/10.5281/zenodo.19344200"
        ],
        "isBasedOn": "https://ctdbase.org",
        "keywords": "hypothesis discovery, hypothesis generation, candidate chemical discovery, chemical–gene associations, exploratory analysis, Comparative Toxicogenomics Database, CTD, toxicogenomics, chemical enrichment analysis, gene set enrichment, ORA, GSEA, CAMERA, GSVA, Bioconductor"
      }
      </script>

home:
  title: ctdR — Chemical Enrichment Analysis using CTD
  description: >
    Hypothesis discovery of chemicals linked to a gene set, from the Comparative
    Toxicogenomics Database (CTD): an exploratory R tool for candidate generation.
  links:
    - text: Comparative Toxicogenomics Database
      href: https://ctdbase.org
    - text: Open an issue
      href: https://github.com/drake69/ctdR/issues

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
  - title: "Workflow"
    desc: "End-to-end functions for the typical ctdR analysis."
    contents:
      - import_CTD
      - enrichment_CTD
      - plot_CTD
  - title: "Data access and interoperability"
    desc: >
      Read a CTD file the Bioconductor way, retrieve cached tables, and export
      the CTD gene sets for use with other enrichment engines.
    contents:
      - CTDFile
      - ctd_cache
      - as_genesets_CTD
  - title: "Package"
    contents:
      - ctdR-package

articles:
  - title: "Introduction"
    navbar: ~
    contents:
      - ctdR
  - title: "Tutorials"
    navbar: "Tutorials"
    contents:
      - articles/tutorial_rnaseq_workflow

news:
  releases:
    - text: "v0.99.2"
      href: https://github.com/drake69/ctdR/releases/tag/v0.99.2
