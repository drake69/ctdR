      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["SoftwareApplication", "SoftwareSourceCode"],
        "name": "ctdR",
        "description": "An R tool for hypothesis discovery: it surfaces candidate chemicals associated with a set of genes, using the Comparative Toxicogenomics Database (CTD), for exploratory follow-up rather than confirmatory inference. Four enrichment methods (ORA, GSEA, CAMERA, GSVA) are the underlying means, exposed through a unified interface.",
